forgePlugin: false
# extract.config.yaml — repo-extract standalone package export for @warpgogol/pbp
# Extracts packages/pbp from the werkstatt monorepo into a standalone public repo.
# Required because @warpgogol/werkstatt-engine imports @warpgogol/pbp/entities (RFC-1281).

projectDir: packages/pbp
destName: pbp
standalone: true

workspacePrefixes:
  - "@warpgogol/"
stripScopes:
  - "@warpgogol/"
  - "@syrokomskyi/"
preservePackages:
  - "@warpgogol/pbp"
  - "@warpgogol/werkstatt-shared"
packageManager: pnpm

ci:
  provider: github-actions
  publish: true
  nodeVersion: 24
  provenance: true

ignoreDirs:
  - .turbo
  - .agents
  - node_modules
  - tmp-*

excludePathSegments:
  - .npmrc
  - pnpm-lock.yaml

postProcess:
  - action: delete
    path: AGENTS.md
  - action: delete
    path: pnpm-lock.yaml
  - action: copy
    from: packages/pbp/pnpm-workspace.override.yaml
    to: pnpm-workspace.yaml

git:
  remote: git@github.com:syrokomskyi/pbp.git
  autoPush: true
  # Never force-push; non-fast-forward reconciles via fetch + merge -s ours.
  autoReconcile: true
